name: build apk (no-root)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: unzip source
        run: |
          if [ ! -d astral_nr ] && [ -f astral_nr.zip ]; then unzip -o astral_nr.zip; fi
          test -d astral_nr

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: install android sdk cmdline-tools
        run: |
          SDK=$HOME/android-sdk
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
          unzip -q cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK/platform-tools" >> $GITHUB_PATH

      - name: install platform + build-tools
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-33" "build-tools;34.0.0"

      - name: fetch r8 (minify/obfuscate)
        run: |
          curl -sSL -o r8.jar "https://maven.google.com/com/android/tools/r8/9.3.35/r8-9.3.35.jar"
          echo "R8_JAR=$PWD/r8.jar" >> $GITHUB_ENV

      - name: build apk
        run: |
          cd astral_nr
          chmod +x build_apk.sh
          R8_JAR="$R8_JAR" ./build_apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: astral-nr-apk
          path: astral_nr/astral_nr.apk
